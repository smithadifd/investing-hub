[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investing-hub"
version = "0.0.1"
description = "Advisor and attention layer that pairs with Investing Companion."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
hub = "hub.cli:main"

[tool.setuptools]
packages = ["hub"]

[tool.setuptools.package-data]
hub = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
